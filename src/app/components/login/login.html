<div class="login-wrapper">
  <div class="login-left">
    <div class="brand">
      <img src="assets/shield-icon.png" alt="Logo" class="logo" />
      <div class="brand-text">
        <h2>PrivateRepo</h2>
        <p class="tagline">SecureView</p>
      </div>
    </div>

    <h1 class="main-title">
      Share Your Private<br />GitHub Repositories
    </h1>

    <p class="description">
      Securely share read-only access to your private GitHub repositories with expiring links.
    </p>

    <button class="login-btn" (click)="loginWithGitHub()">
      <mat-icon>login</mat-icon> Login with GitHub
    </button>

    <p class="footer-note">Secure sharing made simple.</p>
  </div>

  <div class="login-right">
    <img src="assets/secure.png" alt="Secure Illustration" class="illustration" />
  </div>
</div>
