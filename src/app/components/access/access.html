<div class="container">
  <div class="sidebar">
    <ng-container *ngFor="let node of fileTree">
      <app-file-node
        [node]="node"
        (fileSelected)="onFileSelected($event)">
      </app-file-node>
    </ng-container>
  </div>

  <div class="content">
    <app-monaco-viewer
      *ngIf="selectedFileContent"
      [code]="selectedFileContent">
    </app-monaco-viewer>
  </div>
</div>
