<div *ngIf="userLogin">
  <h2>Welcome, {{ userLogin }}!</h2>

</div>

<div *ngIf="!userLogin">
  <p>Loading user data...</p>
</div>

<div class="container">
  

  <!-- Search Box -->
  <div class="search-box">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="onInput($event)"
      placeholder="🔍 Search repositories..."
    />

    <div class="buttons" *ngIf="selectedRepo">
      <button (click)="copyToClipboard(selectedRepo.url)">📋 Copy URL</button>
      <button class="reset" (click)="resetSelection()">🔄 Reset</button>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div class="spinner" *ngIf="isLoading"></div>

  <!-- No Results -->
  <div
    class="no-results"
    *ngIf="!isLoading && !selectedRepo && filteredRepos.length === 0 && searchTerm"
  >
    No repositories found.
  </div>

  <!-- Repo List -->
  <ul class="repo-list" *ngIf="!selectedRepo && filteredRepos.length > 0">
    <li *ngFor="let repo of filteredRepos" (click)="selectRepo(repo)">
      {{ repo.name }}
    </li>
  </ul>
</div>
