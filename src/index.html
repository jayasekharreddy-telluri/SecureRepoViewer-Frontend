<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GithubShareFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
  
<script src="assets/monaco/vs/loader.js"></script>
<script>
  if (typeof require !== 'undefined') {
    require.config({ paths: { vs: 'assets/monaco/vs' } });

    window.MonacoEnvironment = {
      getWorkerUrl: function (_, label) {
        return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
          self.MonacoEnvironment = { baseUrl: 'assets/monaco/' };
          importScripts('assets/monaco/vs/base/worker/workerMain.js');`
        )}`;
      }
    };

    require(['vs/editor/editor.main'], function () {
      window.monacoLoaded = true;
      window.monaco = monaco;
    });
  } else {
    console.error('Monaco loader (require.js) failed to load.');
  }
</script>

</body>
</html>
